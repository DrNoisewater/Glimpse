# Publishes a release by hand: Actions → Release → Run workflow → enter the version.
#   1. Checks the version matches CMakeLists.txt and hasn't been released yet.
#   2. Builds Release x64, runs the tests, builds the portable zip and the installer.
#   3. Tags v<version> and publishes the GitHub Release with both files.
# Nothing is tagged unless everything built and the tests passed.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.3.0). Must match project(Glimpse VERSION ...) in CMakeLists.txt.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, and history for the release notes

      - name: Check the version and that the tag is new
        run: |
          $v = $env:VERSION.Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$v' isn't in the form 1.2.3 (three numbers, no leading v)."
          }
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(Glimpse VERSION (\d+\.\d+\.\d+)'
          $cmake = $m.Matches[0].Groups[1].Value
          if ($cmake -ne $v) {
            throw "CMakeLists.txt says version $cmake but you asked to release $v. Change project(Glimpse VERSION ...) to $v (and commit it) first, so the app shows the right version."
          }
          git ls-remote --exit-code --tags origin "refs/tags/v$v" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "The tag v$v already exists, so v$v has already been released. Pick a new version number."
          }
          if ($LASTEXITCODE -ne 2) { throw "Couldn't check the tags on origin (git exit $LASTEXITCODE)." }
          $global:LASTEXITCODE = 0
          Write-Host "Releasing v$v from $env:GITHUB_SHA"

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (the release stops here if any fail)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage the files that ship
        run: cmake --install build --config Release --prefix stage

      - name: Portable zip
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage\* -DestinationPath "dist\Glimpse-$env:VERSION-portable.zip" -Force

      - name: Get Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
          }

      - name: Installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$env:VERSION" "/DStageDir=$PWD\stage" "/DOutputDir=$PWD\dist" installer\Glimpse.iss
          if ($LASTEXITCODE -ne 0) { throw "The installer didn't build (exit $LASTEXITCODE)." }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Tag v${{ inputs.version }}
        run: |
          git tag "v$env:VERSION" "$env:GITHUB_SHA"
          git push origin "refs/tags/v$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Pushing the tag failed.' }

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION
          $notes = @(
            "**Download Glimpse-Setup-$v.exe below and run it.** It installs Glimpse, or updates the one you have. No administrator rights needed.",
            "",
            "- Prefer no installer? Download **Glimpse-$v-portable.zip**, extract it anywhere and run Glimpse.exe.",
            "- Windows may say it doesn't know the publisher: click **More info**, then **Run anyway**.",
            "- Glimpse lives in the system tray. Press **Ctrl+Shift+R** to record.",
            "- Requires 64-bit Windows 10 version 2004 or newer, or Windows 11.",
            ""
          ) -join "`n"
          Set-Content -Path "$env:RUNNER_TEMP\notes.md" -Value $notes -Encoding utf8
          gh release create "v$v" "dist\Glimpse-Setup-$v.exe" "dist\Glimpse-$v-portable.zip" `
            --verify-tag --title "Glimpse v$v" --notes-file "$env:RUNNER_TEMP\notes.md" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
